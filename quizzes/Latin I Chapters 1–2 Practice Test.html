<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: one reading column of numbered exam sections, each tinted with one of the four cycling Glossomathia section hues */
:root{
  --bg:#fbf8fd; --surface:#ffffff; --ink:#4a4458; --muted:#7a7290; --line:#e4dcef;
  --h1:#8e7cc3; --sub:#a88bcf;
  --s1:#8e7cc3; --s1d:#6d5b87; --s1bg:#f7eef9;
  --s2:#5e95ab; --s2d:#3f6d82; --s2bg:#e9f1f7;
  --s3:#5a9670; --s3d:#3f7a54; --s3bg:#eaf6ee;
  --s4:#b87aa0; --s4d:#9c5980; --s4bg:#fbeef5;
  --ok:#2f7d4f; --okbg:#e3f4e9; --bad:#b0413e; --badbg:#fbe7e6;
  --gold:#b8924a;
  --display:"Cormorant Garamond", Georgia, "Times New Roman", serif;
  --body:"Nunito", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1b1822; --surface:#25212e; --ink:#e6e0f0; --muted:#a59cb8; --line:#3a3446;
  --h1:#b9a9ec; --sub:#c7b2e6;
  --s1:#b9a9ec; --s1d:#d3c8f5; --s1bg:#2c2638;
  --s2:#8fc0d4; --s2d:#b7d9e7; --s2bg:#1f2b33;
  --s3:#8ccaa1; --s3d:#b1dfc0; --s3bg:#1f2c24;
  --s4:#dda6c7; --s4d:#ecc4dc; --s4bg:#30222b;
  --ok:#8fd5a8; --okbg:#1e3327; --bad:#f0a29e; --badbg:#3a2224; --gold:#d9b671;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1b1822; --surface:#25212e; --ink:#e6e0f0; --muted:#a59cb8; --line:#3a3446;
  --h1:#b9a9ec; --sub:#c7b2e6;
  --s1:#b9a9ec; --s1d:#d3c8f5; --s1bg:#2c2638;
  --s2:#8fc0d4; --s2d:#b7d9e7; --s2bg:#1f2b33;
  --s3:#8ccaa1; --s3d:#b1dfc0; --s3bg:#1f2c24;
  --s4:#dda6c7; --s4d:#ecc4dc; --s4bg:#30222b;
  --ok:#8fd5a8; --okbg:#1e3327; --bad:#f0a29e; --badbg:#3a2224; --gold:#d9b671;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:28px 64px;display:flex;flex-direction:column;gap:22px}
header{display:flex;flex-direction:column;gap:6px}
.brand{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
h1{font-family:var(--display);font-weight:700;color:var(--h1);font-size:clamp(2rem,6vw,2.7rem);line-height:1.05;margin:0;text-wrap:balance}
.subtitle{font-family:var(--display);font-style:italic;font-size:1.25rem;color:var(--sub);margin:0}
.namerow{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:10px}
.namerow label{font-family:var(--display);font-size:1.25rem;font-weight:600}
.scorecard{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.scorecard b{font-size:1.4rem;font-variant-numeric:tabular-nums}
.scorecard span{color:var(--muted);font-size:.9rem}

section{--c:var(--s1);--cd:var(--s1d);--cbg:var(--s1bg);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 16px 16px;display:flex;flex-direction:column;gap:14px}
section:nth-of-type(4n+2){--c:var(--s2);--cd:var(--s2d);--cbg:var(--s2bg)}
section:nth-of-type(4n+3){--c:var(--s3);--cd:var(--s3d);--cbg:var(--s3bg)}
section:nth-of-type(4n){--c:var(--s4);--cd:var(--s4d);--cbg:var(--s4bg)}
h2{font-family:var(--display);font-size:1.6rem;font-weight:700;color:var(--c);margin:0;line-height:1.15;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
h2 .num{font-size:1.15rem;color:var(--cd)}
h2 .pts{margin-left:auto;font-family:var(--body);font-size:.78rem;font-weight:700;color:var(--muted);letter-spacing:.04em}
h3{font-family:var(--display);font-size:1.25rem;color:var(--cd);margin:4px 0 0}
.instr{margin:0;color:var(--muted);font-size:.95rem}
.la{font-family:var(--display);font-size:1.22rem;font-weight:600}

input[type=text],select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0;width:100%}
textarea{resize:vertical;min-height:2.6em}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2.5px solid var(--c,var(--h1));outline-offset:2px}
.right{border-color:var(--ok)!important;background:var(--okbg)!important}
.wrong{border-color:var(--bad)!important;background:var(--badbg)!important}
.fb{font-size:.85rem;font-weight:700;min-height:1px}
.fb.ok{color:var(--ok)} .fb.no{color:var(--bad)}

.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--cd);text-align:left;padding:8px;background:var(--cbg)}
td{padding:8px;border-top:1px solid var(--line);vertical-align:top}
td .fixed{display:inline-block;padding:7px 2px;font-weight:700}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.vitem,.qitem{display:flex;flex-direction:column;gap:5px;min-width:0}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}

.sent{display:flex;flex-direction:column;gap:6px;padding-block:6px;border-top:1px dashed var(--line)}
.sent:first-of-type{border-top:0}
.words{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lbl{font-weight:800;color:var(--cd);margin-right:4px}
.w{font:inherit;color:var(--ink);background:transparent;border:2px solid transparent;border-radius:6px;padding:2px 6px;cursor:pointer}
.w:hover{background:var(--cbg)}
.w.S{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:5px;text-decoration-color:var(--c)}
.w.O{border-color:var(--cd)}
.w.good{background:var(--okbg)} .w.badm{background:var(--badbg)}
.w.miss{outline:2px dashed var(--bad);outline-offset:1px}
.w.la{font-size:1.25rem}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:.88rem;color:var(--muted)}
.legend .eg{color:var(--ink);font-weight:700}
.legend .egS{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:4px;text-decoration-color:var(--c)}
.legend .egO{border:2px solid var(--cd);border-radius:5px;padding:0 5px}

.sortrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding-block:6px;border-top:1px dashed var(--line)}
.sortrow:first-child{border-top:0}
.sortrow .la{min-width:7.5rem}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{font:inherit;font-weight:700;font-size:.9rem;background:transparent;color:var(--ink);border:0;padding:6px 14px;cursor:pointer}
.seg button+button{border-left:1.5px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--c);color:var(--surface)}

.endrow{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.endrow input{width:5.5rem}
.arrow{color:var(--muted);margin:0 6px}
.model{font-size:.92rem;background:var(--cbg);border-radius:8px;padding:8px 10px}
.model b{color:var(--cd)}
.selfmark{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.88rem}
.note{font-size:.8rem;color:var(--muted)}

.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{font:inherit;font-weight:800;border-radius:999px;padding:9px 18px;cursor:pointer;border:2px solid var(--c,var(--h1));background:var(--c,var(--h1));color:var(--surface)}
.btn.ghost{background:transparent;color:var(--cd,var(--h1))}
.btn.small{padding:5px 12px;font-size:.85rem}
.sscore{font-weight:800;color:var(--cd);font-variant-numeric:tabular-nums}
footer{text-align:center;color:var(--muted);font-family:var(--display);font-size:1.05rem}
footer .flower{color:var(--gold)}
@media (prefers-reduced-motion:no-preference){.w,.seg button,.btn{transition:background .15s,border-color .15s}}
</style>

<div class="wrap">
  <header>
    <div class="brand">Glossomathia · Latin I</div>
    <h1>Chapters 1–2 Practice Test</h1>
    <p class="subtitle">Capitula I et II · nōmina, verba, cāsūs</p>
    <div class="namerow"><label for="student">Nōmen:</label><input type="text" id="student" placeholder="Your name" style="max-width:280px"></div>
  </header>

  <div class="scorecard" aria-live="polite"><b id="total">— / 64</b><span id="totalnote">Check each section, or check the whole test at the end. Macrons are optional when you type.</span></div>

  <main id="quiz" style="display:flex;flex-direction:column;gap:22px"></main>

  <div class="actions">
    <button class="btn" id="checkAll" style="--c:var(--h1)">Check whole test</button>
    <button class="btn ghost" id="resetAll" style="--cd:var(--muted);--c:var(--muted)">Start over</button>
  </div>
  <footer><span class="flower">❀</span> Glossomathia <span class="flower">❀</span></footer>
</div>

<script>
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const el=(t,a={},...k)=>{const e=document.createElement(t);for(const[x,v]of Object.entries(a)){if(x==='class')e.className=v;else if(x==='html')e.innerHTML=v;else if(x.startsWith('on'))e.addEventListener(x.slice(2),v);else e.setAttribute(x,v)}k.flat().forEach(c=>c!=null&&e.append(c));return e};
const N=s=>(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[’‘`]/g,"'").replace(/[^a-z0-9' ]+/g,' ').replace(/\s+/g,' ').trim();

/* meaning matcher: every comma / slash / "or" separated part must match one stem */
const mean=(re,{strip=/^(?:to |i |a |an |the )/}={})=>s=>{
  const parts=(s||'').split(/[,;\/]| or /i).map(N).filter(Boolean);
  if(!parts.length)return false;
  const R=new RegExp('^(?:'+re+')$');
  return parts.every(p=>{p=p.replace(strip,'').replace(/^(?:am |do |will )/,'');return R.test(p)});
};
const P1='i',P2='you(?: singular)?',P3="(?:he|she|it)(?: (?:or |and )?(?:he|she|it))*";
const verb=(pron,v)=>s=>new RegExp('^(?:'+pron+') (?:'+v+')$').test(N(s).replace(/'m\b/,' am'));
const SEARCH='(?:search(?:ing)?|seek(?:ing)?|look(?:ing)?|ask(?:ing)?|inquir(?:e|ing))(?: for)?';
const LIVE='(?:liv(?:e|ing)|dwell(?:ing)?|resid(?:e|ing)|inhabit(?:ing)?)(?: in)?';

let scores={}; const MAX={};
function setScore(id,got){scores[id]=got;const t=Object.values(scores).reduce((a,b)=>a+b,0);$('#total').textContent=`${t} / 64`;const n=Object.keys(scores).length;$('#totalnote').textContent=n===8?`All 8 sections checked · ${Math.round(t/64*100)}%`:`${n} of 8 sections checked`;$(`#sc-${id}`).textContent=`${got} / ${MAX[id]}`}
function mark(input,ok,fbEl,answer){input.classList.toggle('right',ok);input.classList.toggle('wrong',!ok);if(fbEl){fbEl.className='fb '+(ok?'ok':'no');fbEl.textContent=ok?'✓':'→ '+answer}return ok?1:0}
function clearMarks(sec){$$('.right,.wrong',sec).forEach(e=>e.classList.remove('right','wrong'));$$('.fb',sec).forEach(f=>{f.textContent='';f.className='fb'})}

const sections=[];
function makeSection(id,num,title,instr,max,build,check){
  MAX[id]=max;
  const sec=el('section',{id:'sec-'+id},
    el('h2',{},el('span',{class:'num'},num+'.'),title,el('span',{class:'pts'},max+' pts')),
    instr?el('p',{class:'instr',html:instr}):null);
  const body=el('div',{style:'display:flex;flex-direction:column;gap:12px'});build(body);sec.append(body);
  const sc=el('span',{class:'sscore',id:'sc-'+id});
  sec.append(el('div',{class:'actions'},el('button',{class:'btn small',onclick:()=>setScore(id,check(sec))},'Check section'),sc));
  $('#quiz').append(sec);sections.push({id,sec,check});
}

/* ---------- I. Nouns + vocabulary ---------- */
const nouns=[
 {nom:'cibus',acc:'cibum',g:'M',tr:'food|meal',show:'cibum · M · food'},
 {nom:'forum',acc:'forum',g:'N',tr:'forum|market ?place|marketplace|(?:public |town )?square|market',show:'forum, marketplace',fixed:true},
 {nom:'filia',acc:'filiam',g:'F',tr:'daughter',show:'fīliam · F · daughter'},
 {nom:'filius',acc:'filium',g:'M',tr:'son',show:'fīlium · M · son'},
 {nom:'vinum',acc:'vinum',g:'N',tr:'wine',show:'wine',fixed:true},
 {nom:'pecunia',acc:'pecuniam',g:'F',tr:'money|cash',show:'pecūniam · F · money'}];
const vocab=[
 ['et','and'],['magnus','big|great|large|huge'],['quoque','also|too|as well'],['sed','but'],
 ['habeō','ha(?:ve|s|ving)|hold(?:ing)?|own(?:ing)?|possess(?:ing)?'],['cadō','fall(?:s|ing)?'],
 ['habitō',LIVE],['vocō','call(?:s|ing)?|summon(?:s|ing)?|nam(?:e|es|ing)'],
 ['spectō','watch(?:es|ing)?|look(?:s|ing)?(?: at)?|observ(?:e|es|ing)|see(?:s|ing)?'],
 ['quaerō','(?:search(?:es|ing)?|seek(?:s|ing)?|look(?:s|ing)?|ask(?:s|ing)?)(?: for)?'],
 ['salūtō','greet(?:s|ing)?|salut(?:e|es|ing)|say(?:s)? hello(?: to)?|welcome'],
 ['intrō','enter(?:s|ing)?|(?:go|goes|going|come|comes|coming) in(?:to|side)?'],['videō','see(?:s|ing)?']];
const vShow={et:'and',magnus:'big, great',quoque:'also, too',sed:'but','habeō':'I have','cadō':'I fall','habitō':'I live (in)','vocō':'I call','spectō':'I watch, look at','quaerō':'I search for, ask','salūtō':'I greet','intrō':'I enter','videō':'I see'};
makeSection('I','I','Capitulum 2 vocābula',"Nōmina (nouns): write the accusative, the gender, and the translation. Then translate the other words.",27,b=>{
  b.append(el('h3',{},'Nōmina / nouns'));
  const tb=el('tbody');
  nouns.forEach((n,i)=>{
    const g=el('select',{id:`n${i}g`,'aria-label':`gender of ${n.nom}`},['','M','F','N'].map(v=>el('option',{value:v},v||'—')));
    tb.append(el('tr',{},
      el('td',{},el('span',{class:'la'},n.nom)),
      el('td',{},n.fixed?el('span',{class:'fixed la'},n.acc):el('div',{class:'qitem'},el('input',{type:'text',id:`n${i}a`,'aria-label':`accusative of ${n.nom}`,autocomplete:'off',spellcheck:'false'}))),
      el('td',{},n.fixed?el('span',{class:'fixed'},n.g):g),
      el('td',{},el('div',{class:'qitem'},el('input',{type:'text',id:`n${i}t`,'aria-label':`translation of ${n.nom}`,autocomplete:'off'}),el('span',{class:'fb',id:`n${i}f`})))));
  });
  b.append(el('div',{class:'tablewrap'},el('table',{},el('thead',{},el('tr',{},['nōminātīvus','accūsātīvus','genus (M/F/N)','trānslātiō'].map(h=>el('th',{},h)))),tb)));
  b.append(el('h3',{},'Et cētera: scrībe trānslātiōnem'));
  b.append(el('div',{class:'vgrid'},vocab.map(([w],i)=>el('div',{class:'vitem'},el('label',{for:`v${i}`,class:'la'},w),el('input',{type:'text',id:`v${i}`,autocomplete:'off'}),el('span',{class:'fb',id:`v${i}f`})))));
},sec=>{
  clearMarks(sec);let s=0;
  nouns.forEach((n,i)=>{
    let rowOk=true;
    if(!n.fixed){const a=$(`#n${i}a`);const ok=N(a.value)===n.acc;s+=mark(a,ok);rowOk&&=ok;const g=$(`#n${i}g`);const okg=g.value===n.g;s+=mark(g,okg);rowOk&&=okg}
    const t=$(`#n${i}t`);const okt=mean(n.tr)(t.value);s+=mark(t,okt);rowOk&&=okt;
    const f=$(`#n${i}f`);f.className='fb '+(rowOk?'ok':'no');f.textContent=rowOk?'✓':'→ '+n.show;
  });
  vocab.forEach(([w,re],i)=>{s+=mark($(`#v${i}`),mean(re)($(`#v${i}`).value),$(`#v${i}f`),vShow[w])});
  return s;
});

/* ---------- II. Cases ---------- */
const caseQs=[['Which case is the subject of the sentence?','nominative','nominative'],['Which case is the direct object of the sentence?','accusative','accusative']];
makeSection('II','II','The cases','Fill in the blanks.',2,b=>{
  caseQs.forEach(([q],i)=>b.append(el('div',{class:'qitem'},el('label',{for:`c${i}`},q),el('input',{type:'text',id:`c${i}`,autocomplete:'off',style:'max-width:320px'}),el('span',{class:'fb',id:`c${i}f`}))));
},sec=>{clearMarks(sec);let s=0;caseQs.forEach(([,a,show],i)=>{const v=N($(`#c${i}`).value).replace(/ case$/,'');const ok=v===a||v===a.slice(0,3)||v===(a==='nominative'?'nominativus':'accusativus')||v===(a==='nominative'?'nominativ':'accusativ');s+=mark($(`#c${i}`),ok,$(`#c${i}f`),show)});return s});

/* ---------- III & IV. Subject / object tapping ---------- */
function tapSection(id,num,title,max,items,latin){
  const legend=()=>el('div',{class:'legend'},el('span',{},'Tap a word once: ',el('span',{class:'eg egS'},'subject')),el('span',{},'Tap twice: ',el('span',{class:'eg egO'},'direct object')),el('span',{},'Tap again to clear.'));
  makeSection(id,num,title,'1. Underline the subject(s). 2. Box the direct object(s). Some sentences have no direct object.',max,b=>{
    b.append(legend());
    items.forEach((it,si)=>{
      const words=el('div',{class:'words'},el('span',{class:'lbl'},it.l+'.'));
      it.w.forEach((w,wi)=>words.append(el('button',{type:'button',class:'w'+(latin?' la':''),'data-s':si,'data-i':wi,'aria-label':`${w}: not marked`,onclick:e=>{const bt=e.currentTarget;const st=bt.classList.contains('S')?'O':bt.classList.contains('O')?'':'S';bt.classList.remove('S','O','good','badm','miss');if(st)bt.classList.add(st);bt.setAttribute('aria-label',`${w}: ${st==='S'?'subject':st==='O'?'direct object':'not marked'}`)}},w)));
      b.append(el('div',{class:'sent','data-sent':si},words,el('span',{class:'fb',id:`${id}f${si}`})));
    });
  },sec=>{
    let s=0;
    items.forEach((it,si)=>{
      const btns=$$(`.w[data-s="${si}"]`,sec);let ok=true;
      btns.forEach((bt,wi)=>{
        bt.classList.remove('good','badm','miss');
        const st=bt.classList.contains('S')?'S':bt.classList.contains('O')?'O':'';
        const need=it.S.includes(wi)?'S':it.O.includes(wi)?'O':'';
        const opt=(it.oS||[]).includes(wi)?'S':(it.oO||[]).includes(wi)?'O':'';
        if(st){if(st===need||st===opt)bt.classList.add('good');else{bt.classList.add('badm');ok=false}}
        else if(need){bt.classList.add('miss');ok=false}
      });
      const f=$(`#${id}f${si}`);f.className='fb '+(ok?'ok':'no');f.textContent=ok?'✓':'→ '+it.ans;s+=ok?1:0;
    });
    return s;
  });
}
tapSection('III','III','English sentences',6,[
 {l:'a',w:['I','exist','in','this','mortal','plane.'],S:[0],O:[],ans:'subject: I · no direct object'},
 {l:'b',w:['I','will','use','my','time','here','well.'],S:[0],O:[4],oO:[3],ans:'subject: I · direct object: (my) time'},
 {l:'c',w:['This','became','really','deep','for','no','reason!'],S:[0],O:[],ans:'subject: This · no direct object (“became” links, it does not act on anything)'},
 {l:'d',w:['I’m','writing','this','right','before','class.'],S:[0],O:[2],ans:'subject: I(’m) · direct object: this'},
 {l:'e',w:['There','is','a','horse','in','the','hallway.'],S:[3],O:[],oS:[2],ans:'subject: (a) horse · no direct object (“There” is not the subject)'},
 {l:'f',w:['I','know','4','languages,','and','I','want','to','learn','Spanish','too.'],S:[0,5],O:[3,9],oO:[2,7,8],ans:'subjects: I, I · direct objects: (4) languages, (to learn) Spanish'}]);
tapSection('IV','IV','Latin sentences',3,[
 {l:'a',w:['egō','Sabīnam','spectō.'],S:[0],O:[1],ans:'subject: egō · direct object: Sabīnam'},
 {l:'b',w:['equus','in','viā','est.'],S:[0],O:[],ans:'subject: equus · no direct object'},
 {l:'c',w:['Faustus','in','Suburā','īnsulam','habet.'],S:[0],O:[3],ans:'subject: Faustus · direct object: īnsulam'}],true);

/* ---------- V. Declensions ---------- */
